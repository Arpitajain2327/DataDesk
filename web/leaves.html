<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataDesk - Leaves</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: linear-gradient(90deg, #1e3a8a, #3b82f6); }
    .card { border: 0; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold">📊 DataDesk</span>
    <div class="d-flex align-items-center gap-3 text-white">
      <span id="userInfo" class="small"></span>
      <a href="/" class="btn btn-sm btn-light">← Back to dashboard</a>
    </div>
  </div>
</nav>

<div class="container pb-5">

  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card stat-card p-3">
        <div class="text-muted">Pending</div>
        <div class="value text-warning" id="cntPending">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card p-3">
        <div class="text-muted">Approved</div>
        <div class="value text-success" id="cntApproved">0</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card p-3">
        <div class="text-muted">Rejected</div>
        <div class="value text-danger" id="cntRejected">0</div>
      </div>
    </div>
  </div>

  <div class="card p-3">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <h6 class="mb-0 me-auto">Leave Requests</h6>
      <select class="form-select w-auto" id="statusFilter">
        <option value="">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>
      <button class="btn btn-primary d-none" id="applyBtn">+ Record Leave</button>
    </div>
    <div class="table-responsive">
      <table class="table align-middle table-hover mb-0">
        <thead class="table-light">
          <tr><th>ID</th><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="emptyMsg" class="text-center text-muted py-4 d-none">No leave requests found.</div>
  </div>
</div>

<!-- Record leave modal -->
<div class="modal fade" id="leaveModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="leaveForm">
      <div class="modal-header">
        <h5 class="modal-title">Record Leave (on behalf of an employee)</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Employee</label>
          <select class="form-select" id="employeeId" required></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Leave type</label>
          <select class="form-select" id="leaveType" required>
            <option value="Casual">Casual</option>
            <option value="Sick">Sick</option>
            <option value="Earned">Earned</option>
          </select>
        </div>
        <div class="row">
          <div class="col mb-3">
            <label class="form-label">From</label>
            <input type="date" class="form-control" id="startDate" required>
          </div>
          <div class="col mb-3">
            <label class="form-label">To</label>
            <input type="date" class="form-control" id="endDate" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Reason (optional)</label>
          <input type="text" class="form-control" id="reason" maxlength="200">
        </div>
        <div class="text-danger small" id="formError"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let isAdmin = false;
  const modal = new bootstrap.Modal(document.getElementById('leaveModal'));
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const badgeClass = { Pending: 'bg-warning text-dark', Approved: 'bg-success', Rejected: 'bg-danger' };

  async function api(url, method = 'GET', data) {
    const opts = { method };
    if (data) {
      opts.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
      opts.body = new URLSearchParams(data).toString();
    }
    const res = await fetch(url, opts);
    if (res.status === 401) { window.location = '/login.html'; throw new Error('Please log in'); }
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Something went wrong');
    return json;
  }

  async function loadCounts() {
    const all = await api('/api/leaves');
    $('cntPending').textContent = all.filter(l => l.status === 'Pending').length;
    $('cntApproved').textContent = all.filter(l => l.status === 'Approved').length;
    $('cntRejected').textContent = all.filter(l => l.status === 'Rejected').length;
  }

  async function loadLeaves() {
    const list = await api('/api/leaves?status=' + encodeURIComponent($('statusFilter').value));
    $('body').innerHTML = list.map(l => `
      <tr>
        <td>${l.id}</td>
        <td class="fw-semibold">${esc(l.employee)}</td>
        <td>${esc(l.leaveType)}</td>
        <td class="text-nowrap">${esc(l.startDate)}</td>
        <td class="text-nowrap">${esc(l.endDate)}</td>
        <td>${l.days}</td>
        <td>${esc(l.reason)}</td>
        <td><span class="badge ${badgeClass[l.status] || 'bg-secondary'}">${esc(l.status)}</span>
            ${l.decidedBy ? `<div class="small text-muted">by ${esc(l.decidedBy)}</div>` : ''}</td>
        <td class="text-end text-nowrap">
          ${isAdmin && l.status === 'Pending' ? `
            <button class="btn btn-sm btn-success" onclick="decide(${l.id}, 'Approved')">Approve</button>
            <button class="btn btn-sm btn-outline-danger" onclick="decide(${l.id}, 'Rejected')">Reject</button>` : ''}
        </td>
      </tr>`).join('');
    $('emptyMsg').classList.toggle('d-none', list.length > 0);
  }

  async function decide(id, status) {
    if (!confirm(status + ' this leave request?')) return;
    try {
      await api('/api/leaves', 'PUT', { id, status });
      refresh();
    } catch (err) { alert(err.message); }
  }

  async function loadEmployeeOptions() {
    const emps = await api('/api/employees?q=&dept=0');
    $('employeeId').innerHTML = '<option value="">Select employee</option>' +
      emps.map(e => `<option value="${e.id}">${esc(e.name)} (${esc(e.department)})</option>`).join('');
  }

  $('applyBtn').addEventListener('click', () => {
    $('leaveForm').reset();
    $('formError').textContent = '';
    modal.show();
  });

  $('leaveForm').addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      await api('/api/leaves', 'POST', {
        employeeId: $('employeeId').value,
        leaveType: $('leaveType').value,
        startDate: $('startDate').value,
        endDate: $('endDate').value,
        reason: $('reason').value
      });
      modal.hide();
      refresh();
    } catch (err) { $('formError').textContent = err.message; }
  });

  $('statusFilter').addEventListener('change', loadLeaves);

  async function refresh() {
    try { await Promise.all([loadCounts(), loadLeaves()]); }
    catch (err) { alert('Could not load data: ' + err.message); }
  }

  async function init() {
    try {
      const me = await api('/api/me');
      isAdmin = me.role === 'Admin';
      $('userInfo').textContent = me.username + ' (' + me.role + ')';
      if (isAdmin) {
        $('applyBtn').classList.remove('d-none');
        await loadEmployeeOptions();
      }
      refresh();
    } catch (err) { /* redirected to login */ }
  }
  init();
</script>
</body>
</html>
