<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataDesk - Activity</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: linear-gradient(90deg, #1e3a8a, #3b82f6); }
    .card { border: 0; border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
  <div class="container">
    <span class="navbar-brand fw-semibold">📊 DataDesk</span>
    <a href="/" class="btn btn-sm btn-light">← Back to dashboard</a>
  </div>
</nav>

<div class="container pb-5">
  <div class="card p-3">
    <h6 class="mb-3">Recent Activity (latest 50)</h6>
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr>
        </thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div id="msg" class="text-center text-muted py-4 d-none"></div>
  </div>
</div>

<script>
  const esc = s => String(s ?? '').replace(/[&<>"']/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function load() {
    const res = await fetch('/api/activity');
    if (res.status === 401) { window.location = '/login.html'; return; }
    const json = await res.json();
    const msg = document.getElementById('msg');
    if (!res.ok) { msg.textContent = json.error; msg.classList.remove('d-none'); return; }
    if (json.length === 0) { msg.textContent = 'No activity yet.'; msg.classList.remove('d-none'); }
    document.getElementById('body').innerHTML = json.map(a => `
      <tr>
        <td class="text-nowrap">${esc(a.createdAt)}</td>
        <td>${esc(a.username)}</td>
        <td><span class="badge bg-secondary">${esc(a.action)}</span></td>
        <td>${esc(a.details)}</td>
      </tr>`).join('');
  }
  load();
</script>
</body>
</html>
