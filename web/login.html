<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataDesk - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #1e3a8a, #3b82f6); min-height: 100vh; }
    .login-card { border: 0; border-radius: 16px; width: 100%; max-width: 380px; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div class="card login-card p-4 shadow">
    <h4 class="text-center mb-1">📊 DataDesk</h4>
    <p class="text-center text-muted small mb-4">Sign in to continue</p>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <div class="text-danger small mb-2" id="error"></div>
      <button class="btn btn-primary w-100">Login</button>
    </form>
    <div class="text-muted small mt-3 text-center">
      Demo: <b>admin / admin123</b> (full access)<br>
      <b>viewer / viewer123</b> (read only)
    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = new URLSearchParams({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    }).toString();
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body
    });
    const json = await res.json();
    if (res.ok) {
      window.location = '/';
    } else {
      document.getElementById('error').textContent = json.error || 'Login failed';
    }
  });
</script>
</body>
</html>
